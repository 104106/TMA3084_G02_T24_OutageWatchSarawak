name: Flutter CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.x'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get
        working-directory: ./src

      - name: Analyze Code
        run: flutter analyze
        working-directory: ./src

      - name: Run Tests
        run: flutter test
        working-directory: ./src
